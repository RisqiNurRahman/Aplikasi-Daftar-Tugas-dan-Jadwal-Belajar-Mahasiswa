<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TugasKu</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    * {
      --sidebar-width: 150px;
      --warna-utama: #0066CC;
    }
    
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: var(--warna-utama);
    }

    .sidebar .nav-link {
      color: #fff;
      text-align: center;
      border-radius: 0;
    }

    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .navbar-atas {
      margin-left: var(--sidebar-width);
      background: #dbeef8;
      border-bottom: 1px solid var(--warna-utama);
    }


    .konten {
      margin-left: var(--sidebar-width);
      padding: 20px 30px;

    }
  </style>
</head>
<body>

 
  <aside class="sidebar d-flex flex-column text-center">
    <h4 class="text-white py-4 mb-4">TugasKu</h4>
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" href="Dasboardd.html">Beranda</a>
      </li>
    <li class="nav-item">
        <a class="nav-link" href="Matkul.html">Mata Kuliah</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Tugas</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Jadwal</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Rekap</a>
      </li>
    </ul>
  </aside>

  
  <nav class="navbar navbar-atas py-1">
    <div class="container-fluid justify-content-end">
      <span class="navbar-text small text-dark">
        <i class="bi bi-person-circle me-1"></i>Mahasiswa
      </span>
    </div>
  </nav>

    <main class="konten">
    <form action="#" method="post">
      <div class="row g-3">
        <h3 class="mb-3">Edit Tugas</h3>

        <!-- Baris 1: nama tugas dan mata kuliah -->
        <div class="col-md-6">
          <label for="namaTugas" class="form-label fw-semibold">Nama Tugas</label>
          <input type="text" class="form-control" id="namaTugas" name="nama_tugas"
                 placeholder="Masukkan nama tugas" required>
        </div>

        <div class="col-md-6">
          <label for="mataKuliah" class="form-label fw-semibold">Mata Kuliah</label>
          <select class="form-select" id="mataKuliah" name="mata_kuliah" required>
            <option value="" selected disabled>Masukkan Mata Kuliah</option>
            <option value="1">Daspro</option>
            <option value="2">Pemrograman Python</option>
          </select>
        </div>

        <!-- Baris 2: deskripsi -->
        <div class="col-12">
          <label for="deskripsi" class="form-label fw-semibold">Deskripsi</label>
          <textarea class="form-control" id="deskripsi" name="deskripsi" rows="6"
                    placeholder="Masukkan deskripsi tugas..."></textarea>
        </div>

        <!-- Baris 3: deadline, prioritas, status -->
        <div class="col-md-4">
          <label for="deadline" class="form-label fw-semibold">Deadline</label>
          <input type="date" class="form-control" id="deadline" name="deadline" required>
        </div>

        <div class="col-md-4">
          <label for="prioritas" class="form-label fw-semibold">Prioritas</label>
          <select class="form-select" id="prioritas" name="prioritas" required>
            <option value="" selected disabled>Pilih prioritas</option>
            <option value="Tinggi">Tinggi</option>
            <option value="Sedang">Sedang</option>
            <option value="Rendah">Rendah</option>
          </select>
        </div>

        <div class="col-md-4">
          <label for="status" class="form-label fw-semibold">Status</label>
          <select class="form-select" id="status" name="status" required>
            <option value="" selected disabled>Pilih status</option>
            <option value="Belum Selesai">Belum Selesai</option>
            <option value="Selesai">Selesai</option>
          </select>
        </div>

        <!-- Tombol -->
        <div class="col-12 d-flex justify-content-end gap-4 mt-4">
          <a href="Tugas.html" class="btn btn btn-secondary px-4">Batal</a>
          <button type="submit" class="btn btn-primary px-4">Simpan</button>
        </div>

      </div>
    </form>
  </div>
</div>
 


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
