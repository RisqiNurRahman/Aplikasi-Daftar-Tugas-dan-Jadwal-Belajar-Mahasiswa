<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TugasKu</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    * {
      --sidebar-width: 150px;
      --warna-utama: #0066CC;
    }
    
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: var(--warna-utama);
    }

    .sidebar .nav-link {
      color: #fff;
      text-align: center;
      border-radius: 0;
    }

    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .navbar-atas {
      margin-left: var(--sidebar-width);
      background: #dbeef8;
      border-bottom: 1px solid var(--warna-utama);
    }


    .konten {
      margin-left: var(--sidebar-width);
      padding: 20px 30px;

    }
  </style>
</head>
<body>

 
  <aside class="sidebar d-flex flex-column text-center">
    <h4 class="text-white py-4 mb-4">TugasKu</h4>
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" href="Dasboardd.html">Beranda</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="Matkul.html">Mata Kuliah</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="Tugas.html">Tugas</a>
      </li>
      <li class="nav-item">
        <a class="nav-link " href="Jadwal tugas.html">Jadwal</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="Rekap.html">Rekap</a>
      </li>
    </ul>
  </aside>

  
  <nav class="navbar navbar-atas py-1">
    <div class="container-fluid justify-content-end">
      <span class="navbar-text small text-dark">
        <i class="bi bi-person-circle me-1"></i>Mahasiswa
      </span>
    </div>
  </nav>

    <main class="konten">
    <form id="formJadwal">
      <div class="row g-4">
      <h3 class="mb-2">Tambah Jadwal Mata Kuliah</h3>

      <!-- tanggal dan jam -->
      <div class="col-md-6">
        <label for="tanggal" class="form-label fw-semibold fs-5">Tanggal</label>
        <input type="date" class="form-control" id="tanggal" name="tanggal" required>
      </div>

      <div class="col-md-6">
        <label for="mulai" class="form-label fw-semibold fs-5">Jam</label>
        <div class="input-group">
          <input type="time" class="form-control" id="mulai" name="mulai" aria-label="Jam mulai" required>
          <span class="input-group-text">-</span>
          <input type="time" class="form-control" id="selesai" name="selesai" aria-label="Jam selesai" required>
        </div>
      </div>

      <!-- mata kuliah -->
      <div class="col-12">
        <label for="matkul" class="form-label fw-semibold fs-5">Mata Kuliah</label>
        <select class="form-select" id="matkul" name="matkul" required>
          <option value="" selected disabled>Pilih Mata Kuliah</option>
          <option>Daspro</option>
          <option>Dasproweb</option>
          <option>Matematika</option>
        </select>
      </div>

      <!-- topik -->
      <div class="col-12">
        <label for="topik" class="form-label fw-semibold fs-5">Topik</label>
        <textarea class="form-control" id="topik" name="topik" rows="5" placeholder="Masukkan Topik"></textarea>
      </div>

      <!-- Tombol -->
      <div class="col-12 d-flex justify-content-end gap-4 mt-4">
        <a href="Jadwal tugas.html" class="btn btn-secondary px-4">Batal</a>
        <button type="submit" class="btn btn-primary px-4">Simpan</button>
      </div>
    </div>
  </form>
</main>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
