<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TugasKu</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    * {
      --sidebar-width: 150px;
      --warna-utama: #0066CC;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: var(--warna-utama);
    }

    .sidebar .nav-link {
      color: #fff;
      text-align: center;
      border-radius: 0;
    }

    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .navbar-atas {
      margin-left: var(--sidebar-width);
      background: #dbeef8;
      border-bottom: 1px solid var(--warna-utama);
    }

    .konten {
      margin-left: var(--sidebar-width);
      padding: 20px 30px;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar d-flex flex-column text-center">
    <h4 class="text-white py-4 mb-4">TugasKu</h4>
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" href="Dasboardd.html">Beranda</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="Matkul.html">Mata Kuliah</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="Tugas.html">Tugas</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="Jadwal tugas.html">Jadwal</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="rekap.html">Rekap</a>
      </li>
    </ul>
  </aside>

  <!-- NAVBAR -->
  <nav class="navbar navbar-atas py-1">
    <div class="container-fluid justify-content-end">
      <span class="navbar-text small text-dark">
        <i class="bi bi-person-circle me-1"></i>Mahasiswa
      </span>
    </div>
  </nav>

  <!-- KONTEN -->
  <main class="konten">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <h2 class="fw-normal">Jadwal Belajar</h2>
      <a href="Jadwal tugas.html" class="text-decoration-none text-light btn btn-primary">
        +Tambah Jadwal</a>
    </div>

    <form class="d-flex mt-3 mb-4" role="search" style="max-width: 900px;">
      <input class="form-control me-2" type="search" placeholder="Cari Jadwal Belajar..." aria-label="Search">
      <button class="btn btn-primary" type="submit">
        <i class="bi bi-search"></i>
      </button>
    </form>

    <div class="container-fluid my-4 px-5">
      <table class="table table-bordered border-dark text-center align-middle">
        <thead>
          <tr>
            <th>Hari</th>
            <th>Jam</th>
            <th>Matkul</th>
            <th>Topik</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Senin</td>
            <td>08.00 - 11.00</td>
            <td>Daspro</td>
            <td></td>
            <td class="align-middle">
             <div class="d-flex justify-content-center gap-2">
    <a href="edit jadwal.html" class="btn btn-secondary">Edit</a>
    <a href="#" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modalhapus">Hapus</a>
              </div>
            </td>
          </tr>
          <tr>
            <td>Selasa</td>
            <td>13.00 - 16.00</td>
            <td>Dasproweb</td>
            <td></td>
            <td class="align-middle">
              <div class="d-flex justify-content-center gap-2">
                <a href="edit jadwal.html" class="btn btn-secondary">Edit</a>
                <a href="#" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modalhapus">Hapus</a>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- MODAL HAPUS (satu modal dipakai semua baris) -->
    <div class="modal fade" id="modalhapus" tabindex="-1" aria-labelledby="judulHapus" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border: 2px solid #000; border-radius: 30px;">
          <div class="modal-body text-center py-5 px-4">

            <h4 class="mb-4" id="judulHapus">Hapus Jadwal</h4>
            <p class="small mb-4">Apa kamu yakin ingin menghapus jadwal ini?</p>

            <div class="d-flex justify-content-center gap-5">
              <button type="button" class="btn btn-light border border-dark btn-sm px-4" data-bs-dismiss="modal">Batal</button>
              <a href="#" class="btn btn-danger btn-sm px-4">Hapus</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
